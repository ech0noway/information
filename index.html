  <h1 id="typing"></h1>
<script> 
  const text = "Ну что готов владос?";
  let i = 0;
  const speed = 70;
  function typeWriter() {
    if (i < text.length) {
      document.getElementById("typing").innerHTML += text.charAt(i);
      i++;
      setTimeout(typeWriter, speed);
    }
  }
  typeWriter();
</script>

<div class="chatbot-box">
  <h3>чат-бот</h3>
  <div class="chat-log" id="chatLog">
    <p><strong>Гений:</strong> Привет! Напиши что-нибудь 👇</p>
  </div>
  <input type="text" id="chatInput" placeholder="Твое сообщение...">
  <button onclick="sendMessage()">Отправить</button>
</div>

<!-- Звук -->
<audio id="meowSound" src="https://www.fesliyanstudios.com/play-mp3/387" preload="auto"></audio>

<script>
  function sendMessage() {
    const input = document.getElementById("chatInput");
    const log = document.getElementById("chatLog");
    const msg = input.value.trim();
    if (!msg) return;

    log.innerHTML += `<p><strong>Ты:</strong> ${msg}</p>`;
    input.value = "";

    let reply = "Мне еще не добавили такой команды, напиши что-то другое";
    let media = "";
    const msgLow = msg.toLowerCase();

    if (msgLow.includes("привет")) {
      reply = "Привет, чтобы узнать все команды напиши слово команды";
    } else if (msgLow.includes("ку")) {
      reply = "Привет, чтобы узнать все команды напиши слово команды";
    } else if (msgLow.includes("ты уебок")) {
      reply = "Нет я гений, уебок твой стример ебаный";
    } else if (msgLow.includes("иди нахуй")) {
      reply = "Сам иди нахуй";
    } else if (msgLow.includes("пидор")) {
      reply = "К тебе батя в комнату зашёл? Просто я гений, а ещё наверное твой батя😉"
     } else if (msgLow.includes("ПИДОР")) {
      reply = "К тебе батя в комнату зашёл? Просто я гений, а ещё наверное твой батя😉"
    } else if (msgLow.includes("мяу")) {
      reply = "🐱";
      document.getElementById("meowSound").play();
    } else if (msgLow.includes("gif") || msgLow.includes("танцуй")) {
      reply = "Владосик edit 😎";
      media = `<img src="0429.gif">`;
    } else if (msgLow.includes("дай видос")) {
      reply = "Вот тебе лучший видос:";
      media = `<video src="0429.mp4" controls autoplay muted></video>`;
    }

   
    log.innerHTML += `<p><strong>Гений:</strong> ${reply}</p>` + media;
    log.scrollTop = log.scrollHeight;
  }
  document.getElementById("chatInput").addEventListener("keypress", function (e) {
    if (e.key === "Enter") sendMessage();
  });
</script>
